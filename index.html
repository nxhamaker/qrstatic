<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | QR code component</title>

  <style>
    :root {
      --page-bg: #edf1f3;
      --stage-bg: #dfeaf2;
      --card-bg: #f4f4f4;
      --heading: #1a2c4c;
      --body: #5d6b7f;
      --blue: #2b7de9;
      --shadow: rgba(28, 38, 49, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--page-bg);
      font-family: "Outfit", sans-serif;
      overflow: hidden;
      position: relative;
    }

    .shape {
      position: absolute;
      pointer-events: none;
      opacity: 0.8;
    }

    .shape.circle {
      width: 110px;
      height: 110px;
      left: 26px;
      bottom: 110px;
      border-radius: 50%;
      border: 4px solid rgba(86, 173, 197, 0.8);
      background: rgba(86, 173, 197, 0.08);
    }

    .shape.circle::before {
      content: "";
      position: absolute;
      inset: 16px;
      border-radius: 50%;
      background: rgba(86, 173, 197, 0.1);
      box-shadow: 22px 0 0 rgba(86, 173, 197, 0.1), 11px 22px 0 rgba(86, 173, 197, 0.1), 33px 22px 0 rgba(86, 173, 197, 0.1);
    }

    .shape.pink {
      width: 128px;
      height: 128px;
      right: 24px;
      top: 36px;
      border: 4px solid rgba(234, 147, 160, 0.9);
      border-radius: 10px;
      transform: rotate(17deg);
    }

    .shape.pink::before {
      content: "";
      position: absolute;
      inset: 12px;
      border: 4px solid rgba(234, 147, 160, 0.9);
      border-left: none;
      border-top: none;
      border-radius: 0 0 10px 0;
      transform: rotate(15deg);
    }

    .shape.arc {
      width: 180px;
      height: 90px;
      left: 110px;
      top: 70px;
      border: 4px solid rgba(234, 147, 160, 0.85);
      border-right: none;
      border-bottom: none;
      border-radius: 100px 0 0 0;
      transform: rotate(12deg);
    }

    .shape.arc-two {
      width: 220px;
      height: 100px;
      right: 110px;
      bottom: 70px;
      border: 4px solid rgba(120, 193, 210, 0.75);
      border-left: none;
      border-top: none;
      border-radius: 0 0 120px 0;
      transform: rotate(-12deg);
    }

    .design-stage {
      width: min(1180px, 88vw);
      height: 540px;
      background: var(--stage-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .card {
      width: 320px;
      background: rgba(245, 245, 245, 0.95);
      border-radius: 18px;
      box-shadow: 0 16px 30px var(--shadow);
      padding: 18px 18px 22px;
      text-align: center;
    }

    .qr-box {
      background: var(--blue);
      border-radius: 14px;
      padding: 13px;
      margin-bottom: 22px;
      width: 100%;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-box img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
    }

    h1 {
      margin: 0;
      font-size: 1.7rem;
      line-height: 1.15;
      letter-spacing: -0.05em;
      font-weight: 700;
      color: var(--heading);
    }

    p {
      margin: 16px auto 0;
      max-width: 240px;
      font-size: 0.96rem;
      line-height: 1.45;
      color: var(--body);
    }

    @media (max-width: 600px) {
      body {
        padding: 20px;
        overflow: auto;
      }

      .design-stage {
        width: 100%;
        height: auto;
        min-height: 64vh;
      }

      .card {
        width: min(90vw, 320px);
      }
    }
  </style>
</head>
<body>
  <div class="shape circle"></div>
  <div class="shape pink"></div>
  <div class="shape arc"></div>
  <div class="shape arc-two"></div>

  <main class="design-stage">
    <section class="card" aria-label="QR code component">
      <div class="qr-box">
        <img src="./images/image-qr-code.png" alt="QR code leading to Frontend Mentor">
      </div>

      <h1>Improve your front-end<br>skills by building projects</h1>

      <p>Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
    </section>
  </main>
</body>
</html>
